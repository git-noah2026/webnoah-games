<!doctype html>
<html lang="de" data-root="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b1a">
<title>Minenfeld · WebNoah-Games</title>
<meta name="description" content="Minenfeld: Zahlen verraten, wie viele Minen angrenzen. Räum das Feld. Kostenlos im Browser, ohne Konto.">
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../../assets/css/site.css">
</head>
<body data-game="minen">
<div id="site-header"></div>

<main class="play">
  <div class="gutter">
    <a class="back" href="../../#spiele">← Alle Spiele</a>
    <div class="play-head">
      <div>
        <p class="eyebrow" id="p-eyebrow"></p>
        <h1 class="display" id="p-name">Minenfeld</h1>
      </div>
      <div class="play-side">
        <div class="stat"><span class="lbl" id="p-lbl">Punkte</span><span class="val" id="p-score">0</span></div>
        <div class="stat"><span class="lbl" id="p-blbl">Rekord</span><span class="val" id="p-best">–</span></div>
        <button class="btn fav-btn" id="p-fav" type="button" aria-pressed="false">★<span> Merken</span></button>
        <button class="btn primary" id="p-restart" type="button">Neu starten</button>
      </div>
    </div>
    <div class="sheet">
      <div class="tools" id="p-tools"></div>
      <div class="stage" id="stage"></div>
      <p class="status" id="p-status" aria-live="polite"></p>
    </div>
    <p class="help" id="p-help"></p>

    <section class="more" aria-label="Weitere Spiele">
      <h2 class="display">Weitere Spiele</h2>
      <div class="cards" id="more"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="../../assets/js/core.js"></script>
<script src="../../assets/js/catalog.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/previews.js"></script>
<script src="../../assets/js/cards.js"></script>
<script src="game.js"></script>
<script src="../../assets/js/shell.js"></script>
</body>
</html>
